name: Phase 8 offline ledger contract

on:
  pull_request:
    paths:
      - 'scripts/phase8_event_ledger.py'
      - 'scripts/tests/test_phase8_event_ledger.py'
      - 'scripts/phase8_evidence_discovery.py'
      - 'scripts/tests/test_phase8_evidence_discovery.py'
      - 'scripts/phase8-session-recorder.mjs'
      - 'scripts/phase8-paired-evidence.mjs'
      - 'scripts/tests/test_phase8_session_recorder.mjs'
      - 'scripts/tests/test_phase8_paired_evidence.mjs'
      - '.github/workflows/phase8-ledger.yml'
  push:
    branches: [dev]
    paths:
      - 'scripts/phase8_event_ledger.py'
      - 'scripts/tests/test_phase8_event_ledger.py'
      - 'scripts/phase8_evidence_discovery.py'
      - 'scripts/tests/test_phase8_evidence_discovery.py'
      - 'scripts/phase8-session-recorder.mjs'
      - 'scripts/phase8-paired-evidence.mjs'
      - 'scripts/tests/test_phase8_session_recorder.mjs'
      - 'scripts/tests/test_phase8_paired_evidence.mjs'
      - '.github/workflows/phase8-ledger.yml'

permissions:
  contents: read

jobs:
  ledger:
    name: ledger-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify offline ledger parser contract
        run: python -m unittest scripts.tests.test_phase8_event_ledger scripts.tests.test_phase8_evidence_discovery -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify typed capture and OFF/ON evidence intake
        run: node --test scripts/tests/test_phase8_session_recorder.mjs scripts/tests/test_phase8_paired_evidence.mjs
