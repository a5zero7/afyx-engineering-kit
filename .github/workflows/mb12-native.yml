name: MB12 Native Capability Acceptance
on:
  push:
    branches: [dev]
    paths: ['afyx-context/**', 'afyx-forge/**', 'scripts/**', '.github/workflows/mb12-native.yml']
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Discover and run hermetic repository suites
        run: npm run test:hermetic
      - name: Component and isolated browser acceptance
        run: node --test --test-concurrency=1 afyx-context/test/native-consolidation.test.js afyx-forge/test/workflow.test.js afyx-forge/test/refiner-semantics.test.js scripts/tests/test_browser_devtools.mjs scripts/tests/test_browser_engineering.mjs scripts/tests/test_browser_temp_alias.mjs scripts/tests/test_browser_mcp_ergonomics_budget.mjs afyx-context/test/document-conversion.test.js
      - name: Confirm source remains unchanged
        shell: bash
        run: test -z "$(git status --porcelain)"
